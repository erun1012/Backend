plugins {
    id 'java'
}

group = 'com.goner'
version = '0.0.1'

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

configurations {
    invoker
}

dependencies {
    // Cloud Run functions (Functions Framework)
    implementation 'com.google.cloud.functions:functions-framework-api:1.1.0'
    invoker 'com.google.cloud.functions.invoker:java-function-invoker:1.3.1'

    // Firebase Admin SDK (Auth, Firestore, RTDB, Storage, FCM)
    implementation 'com.google.firebase:firebase-admin:9.11.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 취약점 대응: 이행적 의존성 버전 덮어쓰기
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.4')
    implementation 'io.opentelemetry:opentelemetry-api:1.67.0'
}

test {
    useJUnitPlatform()
}

// 로컬 실행: ./gradlew runFunction -PrunFunction.target=com.goner.backend.functions.HelloFunction
tasks.register('runFunction', JavaExec) {
    mainClass = 'com.google.cloud.functions.invoker.runner.Invoker'
    classpath(configurations.invoker)
    inputs.files(configurations.runtimeClasspath, sourceSets.main.output)
    args(
        '--target', project.findProperty('runFunction.target') ?: 'com.goner.backend.functions.HelloFunction',
        '--port', project.findProperty('runFunction.port') ?: 8080
    )
    doFirst {
        args('--classpath', files(configurations.runtimeClasspath, sourceSets.main.output).asPath)
    }
}
